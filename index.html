<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best For You</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Best For You</h1>
    <input type="text" id="search" placeholder="Search products...">
  </header>

  <main>
    <div class="chips" id="chips"></div>

    <h2>Products</h2>
    <div class="grid" id="grid"></div>

    <h2>⚖️ Compare products</h2>
    <div id="compare"></div>

    <h2>🎓 Beginner guide</h2>
    <div id="guide" class="guide-box">Press "Explain it to me" on any product to learn about it.</div>
  </main>

  <script src="script.js"></script>
</body>

</html>
